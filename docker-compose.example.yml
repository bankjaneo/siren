services:
  siren-stream:
    # Pull the pre-built image from GitHub Container Registry (default).
    # Available tags: https://github.com/bankjaneo/siren/pkgs/container/siren
    image: ghcr.io/bankjaneo/siren:latest

    # To build the image locally instead, comment out the "image" line above
    # and uncomment the "build" section below, then run:
    #   docker-compose up --build
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: siren-stream
    network_mode: host
    volumes:
      - ./music:/app/music
    restart: unless-stopped
    environment:
      - MUSIC_FOLDER=${MUSIC_FOLDER:-music/}
      - DEFAULT_DEVICE=${DEFAULT_DEVICE:-Google Nest Mini}
      - PORT=${PORT:-5067}
      - LOOP_DELAY=${LOOP_DELAY:-0.1}
      - DEFAULT_VOLUME=${DEFAULT_VOLUME:-5}
    command: python stream_audio.py
    logging:
      driver: "json-file"
      options:
        max-file: "1"
        max-size: "10m"
