<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141210" />
    <title>Siren</title>
    <script>
      // Apply resolved theme before first paint to avoid a flash.
      // "system" (or anything unrecognized) follows prefers-color-scheme.
      const stored = localStorage.getItem("siren-theme");
      document.documentElement.dataset.theme =
        stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
          ? "dark"
          : "light";
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
